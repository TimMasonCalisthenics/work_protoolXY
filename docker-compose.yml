version: '3.8'
name: work-measurement

services:
  db:
    image: mysql:8.0
    restart: always
    container_name: ${DB_CONTAINER}
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  web-dev:
    profiles: [ "dev" ]
    image: work-measurement-backend:dev
    container_name: work-measurement-web-dev
    build:
      context: ./backend
      target: development
    restart: always
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - ./storage:/app/static/uploads
      - ./backend/migrations:/app/migrations
    environment:
      - PYTHONPATH=/app/src
      - FLASK_DEBUG=1
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AIR_GAUGE_SERVICE=${AIR_GAUGE_SERVICE}
    depends_on:
      - db

  web:
    profiles: [ "prod" ]
    image: work-measurement-backend:latest
    container_name: work-measurement-web
    restart: always
    build:
      context: ./backend
      target: final-prod
    ports:
      - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
    volumes:
      - ./storage:/app/static/uploads
      - ./backend/migrations:/app/migrations
    environment:
      - FLASK_DEBUG=0
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AIR_GAUGE_SERVICE=${AIR_GAUGE_SERVICE}
    depends_on:
      - db

  frontend:
    profiles: [ "prod" ]
    image: work-measurement-frontend:latest
    build: ./frontend
    container_name: factory-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - web
